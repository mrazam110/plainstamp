id: bayernportal
region_id: de-by
name: BayernPortal
base_url: https://www.bayernportal.de
checked: 2026-10-18
verified: partly
level: Land text plus municipality-specific parts loaded after picking a location
structure:
  service_pages: /dokumente/leistung/{id}
  life_situations: /dokumente/lebenslage/{id}
  index: /suche/leistung/alphabetisch
  sitemap: none found (404); robots.txt 404
languages: [de, en (URL pattern unverified), leichte-sprache]
leika: not on pages; present on FIM (e.g. L100042 Anmeldung)
terms:
  url: https://www.bayernportal.de/impressum
  summary: Texts may be copyright-protected; reproduction in other publications only with consent. Private use allowed. No open licence, nothing about bots.
  status: not-cleared
  permission_contact: bayernportal@stmd.bayern.de
crawl:
  method: ask for permission or an XZuFi export first; then targeted URLs only, no location-specific pages
  rate: 1 request per 3 s, identifying User-Agent, cached
  adapter: bayern
  delay_seconds: 3
  allowed_local_dev: true  # robots.txt, crawl-delay, identifying User-Agent; data stays out of git
  allowed_public: false  # needs written permission or a licence
topics_verified:
