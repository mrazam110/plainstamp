name: signatures
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then range="$BASE_SHA..${{ github.event.pull_request.head.sha }}"
          elif echo "$BEFORE" | grep -qv '^0*$'; then range="$BEFORE..$HEAD_SHA"
          else range="$HEAD_SHA"; fi
          git log --format=%B "$range" | scripts/check-signatures.sh
      - name: PR title and description
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | scripts/check-signatures.sh
