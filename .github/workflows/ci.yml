name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml beautifulsoup4 lxml requests snowballstemmer pytest
      - run: PYTHONPATH=ingest python -m pytest -q ingest
