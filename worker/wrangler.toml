name = "plainstamp-api"
main = "src/index.ts"
workers_dev = false
routes = [{ pattern = "plainstamp-api.razadetechnologies.com", custom_domain = true }]
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# No request logging: the Worker code never logs, and platform invocation logs stay off.
[observability]
enabled = false

# Abuse protection (see docs/WORKFLOW.md for the Cloudflare setup). The Worker refuses to serve (503)
# until the bindings and secrets below exist, because REQUIRE_GUARDS = "1".
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 4
  period = 60

# Sized to the free Gemini tier (about 15 text requests a minute, 2 per question): per Cloudflare location.
[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 6
  period = 60

[vars]
REQUIRE_GUARDS = "1"
ALLOWED_ORIGINS = "https://plainstamp.razadetechnologies.com"
RETRIEVER_BACKEND = "postgres"
LLM_PROVIDER = "gemini"
LLM_MODEL = "gemini-3.5-flash-lite"
EMBEDDING_PROVIDER = "gemini"
EMBEDDING_MODEL = "gemini-embedding-2"
EMBEDDING_DIMENSION = "768"
# Secrets (set with `wrangler secret put`, never in this file): GEMINI_API_KEY, DATABASE_URL, TURNSTILE_SECRET, RATE_SALT
# Hyperdrive binding for the database goes here once created: [[hyperdrive]] binding = "HYPERDRIVE"
